<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>花艺瓶 · 分步教学参考</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>
  <h1>我的花艺瓶</h1>
  <p id="instructions">拖动植物布置花艺瓶；也可按 Tab 选择植物，再按方向键移动。刷新页面可复位。</p>
  <div class="stage-scroll">
    <main id="page" aria-label="花艺瓶布置区">
      <div id="left-container" class="container">
        <div class="plant-holder"><img class="plant" id="plant1" src="../solution/images/plant1.png" alt="盆栽 1" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant2" src="../solution/images/plant2.png" alt="盆栽 2" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant3" src="../solution/images/plant3.png" alt="盆栽 3" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant4" src="../solution/images/plant4.png" alt="盆栽 4" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant5" src="../solution/images/plant5.png" alt="盆栽 5" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant6" src="../solution/images/plant6.png" alt="盆栽 6" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant7" src="../solution/images/plant7.png" alt="盆栽 7" tabindex="0" draggable="false" aria-describedby="instructions"></div>
      </div>
      <div id="right-container" class="container">
        <div class="plant-holder"><img class="plant" id="plant8" src="../solution/images/plant8.png" alt="盆栽 8" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant9" src="../solution/images/plant9.png" alt="盆栽 9" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant10" src="../solution/images/plant10.png" alt="盆栽 10" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant11" src="../solution/images/plant11.png" alt="盆栽 11" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant12" src="../solution/images/plant12.png" alt="盆栽 12" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant13" src="../solution/images/plant13.png" alt="盆栽 13" tabindex="0" draggable="false" aria-describedby="instructions"></div>
        <div class="plant-holder"><img class="plant" id="plant14" src="../solution/images/plant14.png" alt="盆栽 14" tabindex="0" draggable="false" aria-describedby="instructions"></div>
      </div>
      <div id="terrarium" aria-hidden="true">
        <div class="jar-top"></div>
        <div class="jar-walls"><div class="jar-glossy-long"></div><div class="jar-glossy-short"></div></div>
        <div class="dirt"></div>
        <div class="jar-bottom"></div>
      </div>
    </main>
  </div>
</body>
</html>
